<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- Singlet as one continuous garment: straps rise from the body, deep scoop, bold E on the chest -->
  <path fill="#E63946" d="
    M 312 220
    L 404 220
    L 404 320
    L 620 320
    L 620 220
    L 712 220
    L 712 544
    L 648 544
    L 648 804
    L 552 804
    L 552 560
    L 472 560
    L 472 804
    L 376 804
    L 376 544
    L 312 544
    Z"/>

  <!-- Deep chest scoop between the straps (Void) -->
  <path fill="#0D0F14" d="
    M 404 320
    L 620 320
    L 620 360
    L 560 360
    L 512 416
    L 464 360
    L 404 360
    Z"/>

  <!-- Leg / crotch cutout (Void) -->
