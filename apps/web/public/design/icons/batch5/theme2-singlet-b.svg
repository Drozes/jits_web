  <!-- Bold E mark on the chest (white) = brand + rising-bars idea -->
  <rect x="464" y="430" width="46" height="104" fill="#E8EDF2"/>
  <rect x="464" y="430" width="96" height="22" fill="#E8EDF2"/>
  <rect x="464" y="471" width="80" height="22" fill="#E8EDF2"/>
  <rect x="464" y="512" width="112" height="22" fill="#E8EDF2"/>
  <!-- Gold top-bar peak step -->
  <rect x="464" y="408" width="96" height="22" fill="#f59e0b"/>
