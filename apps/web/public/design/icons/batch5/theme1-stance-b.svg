<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- ========== SOLID RED HEX EMBLEM WITH STANCE AS NEGATIVE-SPACE CUTOUT ========== -->
  <!-- Heavy red shield/hex plate; the coiled wrestler stance is carved OUT of it (Void),
       so the figure reads as a dark hole inside the red mark. -->

  <!-- red hexagon plate -->
  <polygon points="512,150 818,328 818,696 512,874 206,696 206,328" fill="#E63946"/>

  <!-- thin inner void bevel for a brutalist plate edge -->
  <polygon points="512,206 770,356 770,668 512,818 254,668 254,356" fill="#E63946"/>

  <!-- ===== NEGATIVE-SPACE WRESTLER (filled Void = cut through the plate) ===== -->
  <!-- low staggered ready-stance, mirrored orientation from concept A -->

  <!-- head ducked -->
  <circle cx="572" cy="332" r="62" fill="#0D0F14"/>

  <!-- hunched torso leaning forward -->
  <polygon points="432,372 612,348 560,540 470,556 420,470" fill="#0D0F14"/>

  <!-- lead arm reaching low forward -->
  <polygon points="470,376 300,452 326,516 492,460" fill="#0D0F14"/>
  <circle cx="300" cy="484" r="40" fill="#0D0F14"/>

  <!-- trail arm tucked -->
  <polygon points="588,392 660,460 604,548 548,486" fill="#0D0F14"/>
  <circle cx="648" cy="512" r="36" fill="#0D0F14"/>

  <!-- hips -->
  <polygon points="446,512 580,520 600,640 470,664 420,584" fill="#0D0F14"/>

  <!-- lead leg bent deep, planted front-left -->
  <polygon points="446,584 520,604 432,748 354,742 414,632" fill="#0D0F14"/>
  <rect x="320" y="742" width="142" height="40" fill="#0D0F14"/>

  <!-- trail leg staggered back-right -->
  <polygon points="540,592 612,616 700,742 620,748 510,648" fill="#0D0F14"/>
  <rect x="566" y="742" width="142" height="40" fill="#0D0F14"/>

  <!-- gold seam: a single energy notch in the plate edge, peak accent -->
  <polygon points="512,150 560,178 512,206 464,178" fill="#f59e0b"/>
</svg>
