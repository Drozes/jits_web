<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- CONCEPT C: Side-PROFILE head wearing the ear-guard. A bold white head
       silhouette in profile, the wrestling cup + over-the-top strap in Signal Red.
       Few heavy shapes so it reads at 48px. -->

  <!-- Head silhouette in profile (white), facing right -->
  <path d="M 360 252
           C 540 252 700 372 700 540
           C 700 668 624 752 540 788
           L 540 856
           L 372 856
           L 372 720
           C 300 676 268 600 268 528
           C 268 372 300 252 360 252 Z"
        fill="#E8EDF2"/>

  <!-- Void carved jaw/neck gap so the profile reads (chin notch) -->
  <path d="M 540 788
           C 600 760 656 700 672 624
           L 716 640
           C 700 736 632 812 552 844 Z"
        fill="#0D0F14"/>

  <!-- THE EAR CUP: big bold red disc over the side of the head -->
  <circle cx="452" cy="544" r="156" fill="#E63946"/>
  <!-- cup vent recess (white) -->
  <circle cx="452" cy="544" r="86" fill="#E8EDF2"/>
  <!-- cup center hole (void) -->
  <circle cx="452" cy="544" r="34" fill="#0D0F14"/>

  <!-- Over-the-top crown strap (red) arcing from the cup up over the head -->
  <path d="M 452 388
           C 452 268 372 224 280 244
           L 296 316
           C 364 304 380 348 380 412 Z"
        fill="#E63946"/>

  <!-- Chin strap (red) dropping from the cup under the jaw -->
  <path d="M 452 700
           C 452 800 392 836 312 828
           L 320 760
           C 372 764 380 736 380 676 Z"
        fill="#E63946"/>

  <!-- Gold buckle on the crown strap (peak / breakthrough accent) -->
  <rect x="300" y="256" width="56" height="40" fill="#f59e0b"/>
  <rect x="316" y="268" width="24" height="16" fill="#0D0F14"/>
</svg>
