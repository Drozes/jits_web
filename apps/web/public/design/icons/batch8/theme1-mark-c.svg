<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="cTile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="0.5" stop-color="#E63946"/>
      <stop offset="1" stop-color="#a01254"/>
    </linearGradient>
    <linearGradient id="cSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cTopGloss" cx="0.5" cy="0.1" r="0.7" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
    <filter id="cBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- full-bleed tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#cTile)"/>

  <!-- diagonal glossy sheen sweep across upper-left -->
  <path d="M 0 180 L 1024 0 V 0 H 0 Z" fill="url(#cTopGloss)" opacity="0"/>
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#cTopGloss)"/>
  <path d="M -40 -40 L 700 -40 L 200 1064 L -40 1064 Z" fill="url(#cSheen)"/>

  <!-- soft dark shadow blob beneath the E for float -->
  <g filter="url(#cBlur)">
    <rect x="300" y="350" width="430" height="380" rx="40" fill="#5c0a2e" opacity="0.55" transform="translate(0,40)"/>
  </g>

  <!-- solid white E, dimensional bevel -->
  <g fill="url(#cBevel)">
    <rect x="320" y="300" width="124" height="424" rx="16"/>
    <rect x="320" y="300" width="370" height="100" rx="16"/>
    <rect x="320" y="462" width="300" height="100" rx="16"/>
    <rect x="320" y="624" width="370" height="100" rx="16"/>
  </g>

  <!-- inner top highlight edge on the E for gloss -->
  <g fill="#ffffff" opacity="0.6">
    <rect x="332" y="312" width="100" height="14" rx="7"/>
    <rect x="332" y="312" width="346" height="14" rx="7"/>
  </g>
</svg>
