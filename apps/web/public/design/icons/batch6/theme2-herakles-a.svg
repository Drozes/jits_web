<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- THE CLUB OF HERAKLES: one heavy diagonal weapon, knotted gnarled head -->
  <!-- diagonal guide runs lower-left grip to upper-right head -->

  <!-- handle / grip shaft -->
  <polygon points="300,748 372,820 612,580 540,508" fill="#E8EDF2"/>

  <!-- grip pommel cap (bottom-left end) -->
  <rect x="252" y="724" width="96" height="96" rx="6" transform="rotate(45 300 772)" fill="#9CA3AF"/>

  <!-- club head: heavy knotted bulb -->
  <polygon points="540,508 612,580 700,492 808,584 884,508 768,340 612,396" fill="#E63946"/>
  <polygon points="540,508 612,580 700,492 612,396" fill="#E63946"/>

  <!-- rounded outer mass of the head (big bulb) -->
  <circle cx="720" cy="404" r="180" fill="#E63946"/>

  <!-- knots / studs on the club head (flat carved gnarls) -->
  <rect x="612" y="320" width="80" height="80" rx="10" transform="rotate(45 652 360)" fill="#0D0F14"/>
  <rect x="734" y="300" width="74" height="74" rx="10" transform="rotate(45 771 337)" fill="#0D0F14"/>
  <rect x="700" y="430" width="78" height="78" rx="10" transform="rotate(45 739 469)" fill="#0D0F14"/>
  <rect x="800" y="420" width="64" height="64" rx="9" transform="rotate(45 832 452)" fill="#0D0F14"/>
  <rect x="600" y="430" width="60" height="60" rx="8" transform="rotate(45 630 460)" fill="#0D0F14"/>

  <!-- gold strike spark at the head's peak = "the breakthrough" -->
  <polygon points="720,180 752,250 826,256 766,302 786,374 720,332 654,374 674,302 614,256 688,250" fill="#f59e0b"/>
</svg>
