<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- Charge panel -->
  <circle cx="512" cy="512" r="352" fill="#13151B"/>

  <!-- Gold forked thunderbolt, emerging above and below the grip -->
  <polygon fill="#f59e0b" points="
    572,150
    436,452
    520,452
    458,874
    632,470
    544,470
    652,150
  "/>

  <!-- Clenched fist gripping the bolt (one solid bold block) -->
  <rect x="356" y="452" width="312" height="208" rx="40" fill="#E63946"/>

  <!-- Four bold knuckles cresting the top -->
  <circle cx="404" cy="452" r="48" fill="#E63946"/>
  <circle cx="476" cy="448" r="50" fill="#E63946"/>
  <circle cx="548" cy="448" r="50" fill="#E63946"/>
  <circle cx="620" cy="452" r="48" fill="#E63946"/>

  <!-- Finger split grooves (void) carving the fingers -->
  <rect x="434" y="452" width="16" height="208" rx="8" fill="#0D0F14"/>
  <rect x="506" y="452" width="16" height="208" rx="8" fill="#0D0F14"/>
  <rect x="578" y="452" width="16" height="208" rx="8" fill="#0D0F14"/>

  <!-- Thumb wrapping across the front of the grip -->
  <rect x="346" y="556" width="240" height="78" rx="39" fill="#bf1212"/>

  <!-- White spark where the bolt exits the top of the grip -->
  <polygon fill="#E8EDF2" points="
    544,470
    632,470
    560,548
  "/>
</svg>
