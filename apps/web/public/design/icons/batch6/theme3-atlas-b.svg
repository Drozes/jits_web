<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- Kneeling Atlas in profile, crushed under the globe -->
  <!-- The massive red sphere pressing down -->
  <circle cx="540" cy="288" r="196" fill="#E63946"/>
  <!-- latitude bands carved out of the sphere -->
  <rect x="344" y="252" width="392" height="26" fill="#0D0F14"/>
  <rect x="372" y="176" width="336" height="22" fill="#0D0F14"/>
  <rect x="372" y="372" width="336" height="22" fill="#0D0F14"/>
  <!-- gold crown sliver = the breakthrough -->
  <rect x="430" y="118" width="220" height="20" fill="#f59e0b"/>

  <!-- Atlas, white profile figure -->
  <!-- bowed head tucked under sphere -->
  <circle cx="430" cy="470" r="52" fill="#E8EDF2"/>

  <!-- arm reaching up bracing the sphere -->
  <polygon points="452,452 520,392 562,432 494,508" fill="#E8EDF2"/>
  <rect x="486" y="386" width="86" height="48" fill="#E8EDF2"/>

  <!-- curved straining back (bowed torso) -->
  <polygon points="382,496 478,506 512,650 348,690" fill="#E8EDF2"/>

  <!-- forward planted leg (thigh + shin) -->
  <polygon points="468,628 560,648 532,756 446,742" fill="#E8EDF2"/>
  <polygon points="528,742 612,742 612,840 540,840" fill="#E8EDF2"/>

  <!-- rear knee down on the ground -->
  <polygon points="356,672 452,690 470,820 316,820" fill="#E8EDF2"/>

  <!-- ground line under the strain -->
  <rect x="280" y="820" width="392" height="32" fill="#E63946"/>
</svg>
