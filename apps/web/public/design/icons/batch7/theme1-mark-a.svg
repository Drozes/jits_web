<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>
  <!-- Monoline E: vertical spine + three ascending bars reading like a rising rating -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical spine of the E -->
    <line x1="320" y1="300" x2="320" y2="724" stroke="#E8EDF2" stroke-width="34"/>
    <!-- bottom bar (shortest / lowest) -->
    <line x1="320" y1="724" x2="560" y2="724" stroke="#E8EDF2" stroke-width="34"/>
    <!-- middle bar -->
    <line x1="320" y1="512" x2="640" y2="512" stroke="#E8EDF2" stroke-width="34"/>
    <!-- top bar (longest / highest) in Signal Red -->
    <line x1="320" y1="300" x2="720" y2="300" stroke="#E63946" stroke-width="34"/>
    <!-- rising arrow head off the top bar, signalling rating ascent -->
    <polyline points="640,360 720,300 660,236" stroke="#E63946" stroke-width="34"/>
  </g>
</svg>
