<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Full-bleed Void background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- Subtle darker checker tiles for arcade-floor feel (still on 16-grid, 64px) -->
  <g fill="#12151C">
    <rect x="0"   y="0"   width="64" height="64"/>
    <rect x="128" y="0"   width="64" height="64"/>
    <rect x="0"   y="128" width="64" height="64"/>
    <rect x="896" y="0"   width="64" height="64"/>
    <rect x="960" y="64"  width="64" height="64"/>
    <rect x="896" y="128" width="64" height="64"/>
    <rect x="0"   y="896" width="64" height="64"/>
    <rect x="128" y="960" width="64" height="64"/>
    <rect x="896" y="896" width="64" height="64"/>
    <rect x="960" y="960" width="64" height="64"/>
  </g>

  <!-- =========================================================
       BIG chunky up-arrow sprite. Built on 16x16 grid (64px cells).
       1-pixel (64px) dark outline = Void around a Signal-Red body,
       with a white highlight inner-stripe for 8-bit shading.
       Grid map (col,row), col 0..15 / row 0..15:
       arrowhead spans cols 2..13, staircased; shaft cols 6..9.
       ========================================================= -->

  <!-- ===== Dark outline layer (drawn first, slightly larger sprite) ===== -->
  <g fill="#06080B">
    <!-- arrowhead outline rows -->
    <rect x="448" y="64"  width="128" height="64"/>          <!-- tip -->
    <rect x="384" y="128" width="256" height="64"/>
    <rect x="320" y="192" width="384" height="64"/>
    <rect x="256" y="256" width="512" height="64"/>
    <rect x="192" y="320" width="640" height="64"/>
    <rect x="128" y="384" width="768" height="64"/>
    <!-- under-wing notch + shaft outline -->
    <rect x="128" y="448" width="192" height="64"/>
    <rect x="704" y="448" width="192" height="64"/>
    <rect x="320" y="448" width="384" height="64"/>
    <!-- shaft outline -->
    <rect x="320" y="512" width="384" height="64"/>
    <rect x="320" y="576" width="384" height="64"/>
    <rect x="320" y="640" width="384" height="64"/>
    <rect x="320" y="704" width="384" height="64"/>
    <rect x="320" y="768" width="384" height="64"/>
    <rect x="320" y="832" width="384" height="64"/>
  </g>

  <!-- ===== Signal Red body (inset by ~1 cell where possible) ===== -->
  <g fill="#E63946">
    <!-- arrowhead -->
    <rect x="448" y="128" width="128" height="64"/>          <!-- tip body -->
    <rect x="384" y="192" width="256" height="64"/>
    <rect x="320" y="256" width="384" height="64"/>
    <rect x="256" y="320" width="512" height="64"/>
    <rect x="192" y="384" width="640" height="64"/>
    <!-- wing bottoms + into shaft -->
    <rect x="192" y="448" width="128" height="64"/>
    <rect x="704" y="448" width="128" height="64"/>
    <rect x="384" y="448" width="256" height="64"/>
    <!-- shaft body -->
    <rect x="384" y="512" width="256" height="64"/>
    <rect x="384" y="576" width="256" height="64"/>
    <rect x="384" y="640" width="256" height="64"/>
    <rect x="384" y="704" width="256" height="64"/>
    <rect x="384" y="768" width="256" height="64"/>
  </g>

  <!-- ===== White highlight stripe (left edge of arrow = light source) ===== -->
  <g fill="#E8EDF2">
    <!-- highlight running down the left of the shaft -->
    <rect x="384" y="512" width="64" height="64"/>
    <rect x="384" y="576" width="64" height="64"/>
    <rect x="384" y="640" width="64" height="64"/>
    <rect x="384" y="704" width="64" height="64"/>
    <!-- highlight notch on arrowhead left diagonal -->
    <rect x="448" y="192" width="64" height="64"/>
    <rect x="384" y="256" width="64" height="64"/>
    <rect x="320" y="320" width="64" height="64"/>
    <rect x="256" y="384" width="64" height="64"/>
  </g>

  <!-- ===== Gold "ELO up" spark pixels flanking the tip ===== -->
  <g fill="#f59e0b">
    <rect x="192" y="128" width="64" height="64"/>
    <rect x="768" y="128" width="64" height="64"/>
    <rect x="128" y="64"  width="64" height="64"/>
    <rect x="832" y="64"  width="64" height="64"/>
  </g>
</svg>
