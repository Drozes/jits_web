<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- full-bleed Void background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- subtle pixel-grid dotted texture -->
  <g fill="#161a22">
    <rect x="64" y="64" width="32" height="32"/>
    <rect x="192" y="64" width="32" height="32"/>
    <rect x="832" y="64" width="32" height="32"/>
    <rect x="928" y="128" width="32" height="32"/>
    <rect x="96" y="896" width="32" height="32"/>
    <rect x="864" y="928" width="32" height="32"/>
    <rect x="64" y="512" width="32" height="32"/>
    <rect x="928" y="512" width="32" height="32"/>
  </g>

  <!-- 24x24 grid, cell ~42.667px. Pixel MEDAL with ribbon, centered.
       I use a 42.667 step; coords are multiples of 42.667 rounded to keep grid feel.
       For clean edges I align medal to a 64px sub-grid for the disc. -->

  <!-- ===== ribbon (two angled bands, staircased pixels) ===== -->
  <!-- left ribbon band: Signal Red, descending staircase from neck to disc -->
  <g fill="#E63946">
    <rect x="384" y="128" width="64" height="64"/>
    <rect x="384" y="192" width="64" height="64"/>
    <rect x="416" y="256" width="64" height="64"/>
    <rect x="448" y="320" width="64" height="64"/>
  </g>
  <!-- left ribbon shade -->
  <g fill="#a52532">
    <rect x="384" y="128" width="32" height="128"/>
  </g>
  <!-- right ribbon band: white -->
  <g fill="#E8EDF2">
    <rect x="576" y="128" width="64" height="64"/>
    <rect x="576" y="192" width="64" height="64"/>
    <rect x="512" y="256" width="64" height="64"/>
    <rect x="512" y="320" width="64" height="64"/>
  </g>
  <!-- right ribbon shade -->
  <g fill="#aeb6c2">
    <rect x="608" y="128" width="32" height="128"/>
  </g>

  <!-- ===== gold medal disc (built from pixel rows to approximate a circle) ===== -->
  <!-- dark outline ring -->
  <g fill="#0D0F14">
    <rect x="416" y="320" width="192" height="64"/>
    <rect x="352" y="384" width="320" height="64"/>
    <rect x="320" y="448" width="384" height="192"/>
    <rect x="352" y="640" width="320" height="64"/>
    <rect x="416" y="704" width="192" height="64"/>
  </g>

  <!-- gold fill (inset 32px from outline) -->
  <g fill="#f59e0b">
    <rect x="448" y="352" width="128" height="64"/>
    <rect x="384" y="416" width="256" height="64"/>
    <rect x="352" y="480" width="320" height="128"/>
    <rect x="384" y="608" width="256" height="64"/>
    <rect x="448" y="672" width="128" height="64"/>
  </g>

  <!-- gold highlight (upper-left) -->
  <g fill="#fcd34d">
    <rect x="448" y="352" width="64" height="64"/>
    <rect x="384" y="416" width="64" height="64"/>
    <rect x="352" y="480" width="64" height="64"/>
  </g>
  <!-- gold shade (lower-right) -->
  <g fill="#b45309">
    <rect x="576" y="608" width="64" height="64"/>
    <rect x="512" y="672" width="64" height="64"/>
    <rect x="608" y="480" width="64" height="64"/>
  </g>

  <!-- ===== Signal Red star at center of medal (pixel star) ===== -->
  <g fill="#E63946">
    <!-- top point -->
    <rect x="480" y="416" width="64" height="64"/>
    <!-- mid bar -->
    <rect x="384" y="480" width="256" height="64"/>
    <!-- lower body -->
    <rect x="416" y="544" width="192" height="64"/>
    <!-- legs -->
    <rect x="416" y="608" width="64" height="32"/>
    <rect x="544" y="608" width="64" height="32"/>
  </g>
  <!-- star inner highlight -->
  <g fill="#ff6b76">
    <rect x="480" y="480" width="64" height="64"/>
  </g>

  <!-- ===== gold sparkles ===== -->
  <g fill="#fcd34d">
    <rect x="704" y="320" width="32" height="32"/>
    <rect x="736" y="352" width="32" height="32"/>
    <rect x="288" y="640" width="32" height="32"/>
    <rect x="256" y="672" width="32" height="32"/>
  </g>
</svg>
