<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- full-bleed Void background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- subtle darker scanline tiles to reinforce pixel-grid feel -->
  <g fill="#11141b">
    <rect x="0" y="64" width="1024" height="64"/>
    <rect x="0" y="192" width="1024" height="64"/>
    <rect x="0" y="320" width="1024" height="64"/>
    <rect x="0" y="448" width="1024" height="64"/>
    <rect x="0" y="576" width="1024" height="64"/>
    <rect x="0" y="704" width="1024" height="64"/>
    <rect x="0" y="832" width="1024" height="64"/>
    <rect x="0" y="960" width="1024" height="64"/>
  </g>

  <!-- 16x16 grid, cell = 64px. Pixel art = TROPHY CUP on podium.
       Helper mental map: col/row 0..15 -> x=col*64, y=row*64 -->

  <!-- ===== gold cup body & handles (gold #f59e0b, white highlight, dark outline) ===== -->
  <g>
    <!-- dark 1px outline ring around cup (drawn as blocks behind) -->
    <g fill="#0D0F14">
      <rect x="320" y="128" width="384" height="64"/>
      <rect x="256" y="192" width="64" height="192"/>
      <rect x="704" y="192" width="64" height="192"/>
      <rect x="288" y="384" width="448" height="64"/>
      <rect x="352" y="448" width="320" height="64"/>
    </g>

    <!-- cup rim -->
    <g fill="#f59e0b">
      <rect x="320" y="128" width="384" height="64"/>
    </g>
    <g fill="#fcd34d">
      <rect x="320" y="128" width="64" height="64"/>
    </g>

    <!-- cup bowl rows (taper inward as it goes down) -->
    <g fill="#f59e0b">
      <rect x="320" y="192" width="384" height="64"/>
      <rect x="320" y="256" width="384" height="64"/>
      <rect x="352" y="320" width="320" height="64"/>
      <rect x="384" y="384" width="256" height="64"/>
    </g>
    <!-- bowl left-edge highlight -->
    <g fill="#fcd34d">
      <rect x="320" y="192" width="64" height="64"/>
      <rect x="320" y="256" width="64" height="64"/>
      <rect x="352" y="320" width="64" height="64"/>
    </g>
    <!-- bowl right-edge shade -->
    <g fill="#b45309">
      <rect x="640" y="192" width="64" height="64"/>
      <rect x="640" y="256" width="64" height="64"/>
      <rect x="608" y="320" width="64" height="64"/>
      <rect x="576" y="384" width="64" height="64"/>
    </g>

    <!-- handles (left & right) -->
    <g fill="#f59e0b">
      <rect x="256" y="192" width="64" height="64"/>
      <rect x="256" y="256" width="64" height="64"/>
      <rect x="256" y="320" width="64" height="64"/>
      <rect x="704" y="192" width="64" height="64"/>
      <rect x="704" y="256" width="64" height="64"/>
      <rect x="704" y="320" width="64" height="64"/>
    </g>
  </g>

  <!-- ===== Signal Red "1" emblem inside the cup ===== -->
  <g fill="#E63946">
    <rect x="480" y="192" width="64" height="64"/>
    <rect x="544" y="192" width="64" height="64"/>
    <rect x="544" y="256" width="64" height="64"/>
    <rect x="480" y="320" width="192" height="64"/>
  </g>

  <!-- ===== stem & base of trophy (white) ===== -->
  <g fill="#E8EDF2">
    <rect x="480" y="512" width="64" height="64"/>
    <rect x="480" y="576" width="64" height="64"/>
  </g>
  <g fill="#aeb6c2">
    <rect x="480" y="512" width="32" height="128"/>
  </g>

  <!-- trophy base plate -->
  <g fill="#E8EDF2">
    <rect x="384" y="640" width="256" height="64"/>
    <rect x="352" y="704" width="320" height="64"/>
  </g>
  <g fill="#aeb6c2">
    <rect x="384" y="640" width="256" height="16"/>
    <rect x="352" y="752" width="320" height="16"/>
  </g>

  <!-- ===== gold sparkles ===== -->
  <g fill="#fcd34d">
    <rect x="192" y="128" width="32" height="32"/>
    <rect x="160" y="160" width="32" height="32"/>
    <rect x="224" y="160" width="32" height="32"/>
    <rect x="192" y="192" width="32" height="32"/>

    <rect x="800" y="384" width="32" height="32"/>
    <rect x="768" y="416" width="32" height="32"/>
    <rect x="832" y="416" width="32" height="32"/>
    <rect x="800" y="448" width="32" height="32"/>
  </g>
</svg>
