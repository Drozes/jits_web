<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2ECDD"/>
      <stop offset="100%" stop-color="#E0D7C2"/>
    </linearGradient>
    <linearGradient id="bGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2C778"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9C7A32"/>
    </linearGradient>
    <radialGradient id="bMedal" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#7A1F2B"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#1B2A41"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bMedal)" opacity="0.0"/>

  <!-- outer gold disc -->
  <circle cx="512" cy="512" r="470" fill="url(#bGold)"/>
  <!-- navy ring carrying the lettering -->
  <circle cx="512" cy="512" r="448" fill="#1B2A41"/>
  <circle cx="512" cy="512" r="452" fill="none" stroke="#C9A24B" stroke-width="4"/>
  <circle cx="512" cy="512" r="372" fill="none" stroke="#C9A24B" stroke-width="6"/>

  <!-- arched lettering on navy ring (per-letter, librsvg has no textPath) -->
  <g>
    <!-- TOP: ELO RATED -->
    <text x="131.1" y="365.8" font-size="50" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(291.0 131.1 365.8)">E</text>
    <text x="191.6" y="259.4" font-size="50" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(308.2 191.6 259.4)">L</text>
    <text x="280.9" y="175.8" font-size="50" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(325.5 280.9 175.8)">O</text>
    <text x="512.0" y="104.0" font-size="50" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(360.0 512.0 104.0)">R</text>
    <text x="633.0" y="122.4" font-size="50" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(377.2 633.0 122.4)">A</text>
    <text x="743.1" y="175.8" font-size="50" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(394.5 743.1 175.8)">T</text>
    <text x="832.4" y="259.4" font-size="50" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(411.8 832.4 259.4)">E</text>
    <text x="892.9" y="365.8" font-size="50" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(429.0 892.9 365.8)">D</text>
    <!-- BOTTOM: EST 2026 (reads left-to-right) -->
    <text x="278.0" y="846.2" font-size="38" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(35.0 278.0 846.2)">E</text>
    <text x="339.6" y="881.8" font-size="38" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(25.0 339.6 881.8)">S</text>
    <text x="406.4" y="906.1" font-size="38" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(15.0 406.4 906.1)">T</text>
    <text x="547.6" y="918.4" font-size="38" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(-5.0 547.6 918.4)">2</text>
    <text x="617.6" y="906.1" font-size="38" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(-15.0 617.6 906.1)">0</text>
    <text x="684.4" y="881.8" font-size="38" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(-25.0 684.4 881.8)">2</text>
    <text x="746.0" y="846.2" font-size="38" font-family="serif" font-weight="bold" fill="#EDE6D6" text-anchor="middle" transform="rotate(-35.0 746.0 846.2)">6</text>
  </g>
  <!-- side star separators on the navy band -->
  <g fill="#C9A24B">
    <polygon points="138,490 147,514 173,514 152,530 160,556 138,540 116,556 124,530 103,514 129,514"/>
    <polygon points="886,490 895,514 921,514 900,530 908,556 886,540 864,556 872,530 851,514 877,514"/>
  </g>

  <!-- inner cream field -->
  <circle cx="512" cy="512" r="366" fill="url(#bCream)"/>

  <!-- laurel wreath (champion's crown) -->
  <g stroke="#7A1F2B" stroke-width="0" fill="#7A1F2B" opacity="0.92">
    <g>
      <!-- left branch -->
      <path d="M512 800 Q300 760 250 540 Q235 430 300 350" fill="none" stroke="#7A1F2B" stroke-width="12"/>
    </g>
    <g transform="translate(1024,0) scale(-1,1)">
      <path d="M512 800 Q300 760 250 540 Q235 430 300 350" fill="none" stroke="#7A1F2B" stroke-width="12"/>
    </g>
  </g>
  <g fill="#7A1F2B">
    <!-- leaves left -->
    <g>
      <ellipse cx="248" cy="490" rx="34" ry="15" transform="rotate(-72 248 490)"/>
      <ellipse cx="258" cy="545" rx="36" ry="16" transform="rotate(-55 258 545)"/>
      <ellipse cx="278" cy="600" rx="38" ry="16" transform="rotate(-40 278 600)"/>
      <ellipse cx="312" cy="650" rx="38" ry="16" transform="rotate(-25 312 650)"/>
      <ellipse cx="358" cy="694" rx="36" ry="15" transform="rotate(-12 358 694)"/>
      <ellipse cx="288" cy="430" rx="32" ry="14" transform="rotate(-82 288 430)"/>
    </g>
    <g transform="translate(1024,0) scale(-1,1)">
      <ellipse cx="248" cy="490" rx="34" ry="15" transform="rotate(-72 248 490)"/>
      <ellipse cx="258" cy="545" rx="36" ry="16" transform="rotate(-55 258 545)"/>
      <ellipse cx="278" cy="600" rx="38" ry="16" transform="rotate(-40 278 600)"/>
      <ellipse cx="312" cy="650" rx="38" ry="16" transform="rotate(-25 312 650)"/>
      <ellipse cx="358" cy="694" rx="36" ry="15" transform="rotate(-12 358 694)"/>
      <ellipse cx="288" cy="430" rx="32" ry="14" transform="rotate(-82 288 430)"/>
    </g>
  </g>
  <!-- wreath tie ribbon at bottom -->
  <g fill="#C9A24B" stroke="#9C7A32" stroke-width="4">
    <path d="M468 770 L 512 740 L 556 770 L 540 800 L 484 800 Z"/>
    <path d="M448 800 L 470 836 L 500 808 Z"/>
    <path d="M576 800 L 554 836 L 524 808 Z"/>
  </g>

  <!-- CENTRAL CHAMPION MEDAL (strong simple star disc) -->
  <circle cx="512" cy="490" r="150" fill="url(#bGold)"/>
  <circle cx="512" cy="490" r="150" fill="none" stroke="#9C7A32" stroke-width="8"/>
  <circle cx="512" cy="490" r="120" fill="url(#bMedal)"/>
  <circle cx="512" cy="490" r="120" fill="none" stroke="#C9A24B" stroke-width="6"/>
  <!-- big champion star -->
  <polygon points="512,392 538,463 614,463 553,508 576,580 512,536 448,580 471,508 410,463 486,463"
           fill="#EDE6D6" stroke="#C9A24B" stroke-width="5"/>
  <!-- numeral 1 in star center -->
  <text x="512" y="512" font-family="serif" font-size="78" font-weight="bold" fill="#7A1F2B" text-anchor="middle">1</text>
</svg>
