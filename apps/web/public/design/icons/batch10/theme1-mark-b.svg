<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="creamB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3EEDF"/>
      <stop offset="100%" stop-color="#E2D8C2"/>
    </linearGradient>
    <radialGradient id="discB" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8A2530"/>
      <stop offset="100%" stop-color="#7A1F2B"/>
    </radialGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6C97C"/>
      <stop offset="55%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9C7B30"/>
    </linearGradient>
    <linearGradient id="navyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27395C"/>
      <stop offset="100%" stop-color="#1B2A41"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background: cream tile -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#creamB)"/>
  <!-- subtle navy corner frame -->
  <rect x="46" y="46" width="932" height="932" fill="none" stroke="#1B2A41" stroke-width="6" opacity="0.35"/>
  <rect x="64" y="64" width="896" height="896" fill="none" stroke="#C9A24B" stroke-width="3" opacity="0.5"/>

  <!-- outer disc + rings -->
  <circle cx="512" cy="512" r="338" fill="url(#navyB)"/>
  <circle cx="512" cy="512" r="338" fill="none" stroke="url(#goldB)" stroke-width="16"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#C9A24B" stroke-width="4" opacity="0.7"/>

  <!-- ring text: straight serif (renders in rsvg) -->
  <text x="512" y="262" font-family="serif" font-size="54" font-weight="bold" fill="#E6C97C" text-anchor="middle" letter-spacing="9">ELO RATED</text>
  <text x="512" y="778" font-family="serif" font-size="42" font-weight="bold" fill="#E6C97C" text-anchor="middle" letter-spacing="10">EST 2026</text>

  <!-- decorative ring ticks (heraldic) -->
  <g fill="#C9A24B">
    <circle cx="252" cy="512" r="9"/>
    <circle cx="772" cy="512" r="9"/>
    <polygon points="318,318 334,330 322,346 306,334"/>
    <polygon points="706,318 690,330 702,346 718,334"/>
    <polygon points="318,706 334,694 322,678 306,690"/>
    <polygon points="706,706 690,694 702,678 718,690"/>
  </g>
  <!-- top star markers flanking the ring text -->
  <g fill="#E6C97C">
    <polygon points="298,242 303,255 317,255 306,263 310,277 298,268 286,277 290,263 279,255 293,255"/>
    <polygon points="726,242 731,255 745,255 734,263 738,277 726,268 714,277 718,263 707,255 721,255"/>
  </g>

  <!-- inner disc -->
  <circle cx="512" cy="498" r="178" fill="url(#discB)" stroke="url(#goldB)" stroke-width="9"/>
  <circle cx="512" cy="498" r="162" fill="none" stroke="#EDE6D6" stroke-width="2" opacity="0.4"/>

  <!-- ER monogram (interlocked, cream) -->
  <g fill="#EDE6D6">
    <!-- E -->
    <rect x="418" y="408" width="34" height="180"/>
    <rect x="452" y="408" width="78" height="32"/>
    <rect x="452" y="482" width="64" height="30"/>
    <rect x="452" y="556" width="86" height="32"/>
  </g>
  <g fill="#C9A24B">
    <!-- R interlocked to the right -->
    <rect x="548" y="408" width="32" height="180"/>
    <path d="M580 408 h44 a52 52 0 0 1 0 104 h-44 v-30 h44 a22 22 0 0 0 0 -44 h-44 Z"/>
    <polygon points="580,500 612,500 644,588 606,588"/>
  </g>
  <!-- rising tick mark under monogram -->
  <polygon points="442,604 580,604 580,632 442,632" fill="#E63946" opacity="0.85"/>

  <!-- crossed banner ribbon -->
  <g>
    <polygon points="206,830 318,800 332,852 220,884" fill="#5E1822"/>
    <polygon points="818,830 706,800 692,852 804,884" fill="#5E1822"/>
    <path d="M306 802 L718 802 L744 836 L718 882 L306 882 L280 836 Z" fill="#E63946" stroke="url(#goldB)" stroke-width="6"/>
    <text x="512" y="856" font-family="serif" font-size="46" font-weight="bold" fill="#EDE6D6" text-anchor="middle" letter-spacing="6">RANKED</text>
  </g>
</svg>
