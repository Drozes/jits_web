<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bBg" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#9A2A36"/>
      <stop offset="1" stop-color="#7A1F2B"/>
    </radialGradient>
    <radialGradient id="bMedal" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#E9C878"/>
      <stop offset="0.55" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#9C7A32"/>
    </radialGradient>
    <linearGradient id="bInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22344F"/>
      <stop offset="1" stop-color="#1B2A41"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bBg)"/>

  <!-- corner cream knockouts to give vintage stamp feel -->
  <g fill="#EDE6D6" opacity="0.06">
    <circle cx="512" cy="512" r="498"/>
  </g>

  <!-- outer roundel -->
  <circle cx="512" cy="512" r="452" fill="#1B2A41" stroke="#C9A24B" stroke-width="16"/>
  <circle cx="512" cy="512" r="428" fill="none" stroke="#C9A24B" stroke-width="4"/>

  <!-- ring band guide for vintage lettering -->
  <circle cx="512" cy="512" r="408" fill="none" stroke="#EDE6D6" stroke-width="2" opacity="0.4"/>

  <!-- inner navy disc (drawn before lettering so the gold ring text sits on top) -->
  <circle cx="512" cy="512" r="306" fill="url(#bInner)" stroke="#C9A24B" stroke-width="8"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="#EDE6D6" stroke-width="2" opacity="0.35"/>

  <!-- top straight banner across the roundel: ELO RATED -->
  <path d="M 120 246 L 120 312 L 182 290 L 182 322 L 842 322 L 842 290 L 904 312 L 904 246
           L 826 282 L 826 250 L 198 250 L 198 282 Z"
        fill="#7A1F2B" stroke="#C9A24B" stroke-width="7"/>
  <text x="512" y="299" font-family="serif" font-size="50" font-weight="bold"
        fill="#EDE6D6" text-anchor="middle" letter-spacing="9">ELO RATED</text>

  <!-- EST. 2026 flat lettering flanking the medallion -->
  <text x="262" y="470" font-family="serif" font-size="34" font-weight="bold"
        fill="#C9A24B" text-anchor="middle" letter-spacing="2">EST.</text>
  <text x="762" y="470" font-family="serif" font-size="34" font-weight="bold"
        fill="#C9A24B" text-anchor="middle" letter-spacing="2">2026</text>

  <!-- side star accents in the gold band -->
  <g fill="#C9A24B">
    <polygon points="150,512 158,492 166,512 158,532"/>
    <polygon points="874,512 866,492 858,512 866,532"/>
  </g>

  <!-- laurel sweep at bottom of inner disc -->
  <g fill="none" stroke="#C9A24B" stroke-width="9" stroke-linecap="round">
    <path d="M 360 720 Q 300 660 326 580"/>
    <path d="M 664 720 Q 724 660 698 580"/>
  </g>
  <g fill="#C9A24B">
    <path d="M352 700 q-40 -6 -50 -40 q38 -2 50 40 z"/>
    <path d="M340 654 q-40 -2 -46 -36 q38 2 46 36 z"/>
    <path d="M334 606 q-38 4 -42 -30 q36 4 42 30 z"/>
    <path d="M672 700 q40 -6 50 -40 q-38 -2 -50 40 z"/>
    <path d="M684 654 q40 -2 46 -36 q-38 2 -46 36 z"/>
    <path d="M690 606 q38 4 42 -30 q-36 4 -42 30 z"/>
  </g>

  <!-- CENTRAL CHARGE: rank medallion with climbing chevrons + up-arrow -->
  <circle cx="512" cy="446" r="146" fill="url(#bMedal)" stroke="#7A1F2B" stroke-width="8"/>
  <circle cx="512" cy="446" r="124" fill="none" stroke="#7A1F2B" stroke-width="4" opacity="0.55"/>

  <!-- big upward arrow on the medallion -->
  <g>
    <polygon points="512,338 600,452 552,452 552,548 472,548 472,452 424,452" fill="#7A1F2B"/>
    <polygon points="512,360 580,452 540,452 540,536 484,536 484,452 444,452" fill="#E63946"/>
  </g>

  <!-- ascending chevrons below medallion -->
  <g fill="none" stroke="#C9A24B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 452 636 L 512 596 L 572 636"/>
    <path d="M 452 692 L 512 652 L 572 692"/>
  </g>

  <!-- ribbon banner across the lower roundel -->
  <path d="M 150 700 L 150 770 L 214 746 L 214 784 L 810 784 L 810 746 L 874 770 L 874 700
           L 794 736 L 794 700 L 230 700 L 230 736 Z"
        fill="#7A1F2B" stroke="#C9A24B" stroke-width="7"/>
  <text x="512" y="757" font-family="serif" font-size="44" font-weight="bold"
        fill="#EDE6D6" text-anchor="middle" letter-spacing="6">THE CLIMB</text>
</svg>
