<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    EloRated Icon Mark

    A bold geometric E with ascending bar lengths and a gold peak step.
    Bottom bar shortest, top bar longest, gold block extends one step
    higher at the top-right corner. Reads as both the letter E and a
    rising ELO rating chart. Gold peak = the breakthrough moment.

    Brand red #bf1212 | Gold #f59e0b | White #fff
  -->

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#bf1212"/>

  <!-- White E mark with ascending bar lengths -->
  <path
    d="
      M92 100
      L380 100
      L380 164
      L164 164
      L164 196
      L312 196
      L312 256
      L164 256
      L164 288
      L244 288
      L244 348
      L164 348
      L164 420
      L92 420
      Z
    "
    fill="#fff"
  />

  <!-- Gold peak step: final ascending tier -->
  <rect x="380" y="76" width="40" height="88" fill="#f59e0b"/>
</svg>
