<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- TWO CLINCHED, MATCHED FIGURES locked into one balanced mark.
       Mirror-symmetric heavy silhouettes leaning into each other; the
       narrow Void gap between them is bound by a Signal Red seam = the lock.
       Two-tone (white vs red) so the matched pair reads as evenly weighted
       and legible against the Void field. -->

  <!-- Left figure: solid Terminal White wedge leaning right -->
  <path fill="#E8EDF2"
        d="M168 760
           C 168 560 240 470 360 430
           C 300 392 286 320 330 268
           C 372 220 452 222 484 270
           L 484 760 Z"/>

  <!-- Right figure: solid Signal Red wedge leaning left (the matched opponent) -->
  <path fill="#E63946"
        d="M856 760
           C 856 560 784 470 664 430
           C 724 392 738 320 694 268
           C 652 220 572 222 540 270
           L 540 760 Z"/>

  <!-- The LOCK seam: a tight Void channel where the two grips meet,
       binding the matched pair into one unit. -->
  <rect x="492" y="248" width="40" height="512" fill="#0D0F14"/>

  <!-- Interlocked arms clinching across the seam (over/under weave) -->
  <!-- white arm reaching right, over the seam -->
  <rect x="424" y="470" width="176" height="54" rx="10" fill="#E8EDF2"/>
  <!-- red arm reaching left, crossing under -->
  <rect x="424" y="540" width="176" height="54" rx="10" fill="#E63946"/>
  <!-- seam re-asserted between the two arms so the bind stays visible -->
  <rect x="492" y="470" width="40" height="124" fill="#0D0F14"/>

  <!-- Shared base: a single heavy mat line they both stand on (matched) -->
  <rect x="168" y="760" width="688" height="64" fill="#E8EDF2"/>
  <rect x="512" y="760" width="344" height="64" fill="#E63946"/>
  <!-- center tick on the base marks perfect balance -->
  <rect x="496" y="760" width="32" height="64" fill="#0D0F14"/>
</svg>
