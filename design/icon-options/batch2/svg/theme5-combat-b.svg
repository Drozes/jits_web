<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- THE GRIP: a heavy fist clamping a diagonal gi lapel.
       The lapel is a bold Signal Red band running corner to corner;
       four blocky knuckles + a wrapping thumb clamp it into one solid mark. -->

  <!-- Gi lapel: thick red band, top-left to bottom-right -->
  <polygon fill="#E63946"
           points="296,150 470,150 728,874 554,874"/>
  <!-- Lapel inner fold (deeper red) reads the textile edge -->
  <polygon fill="#bf1212"
           points="392,150 470,150 728,874 650,874"/>

  <!-- Pinched fold where the hand crushes the fabric (red bulges out the top) -->
  <polygon fill="#E63946" points="356,300 486,300 512,372 330,372"/>

  <!-- The fist palm: a solid clamping block crossing the lapel -->
  <rect x="316" y="470" width="392" height="176" rx="18" fill="#E8EDF2"/>

  <!-- Four heavy knuckles rising off the palm -->
  <rect x="356" y="372" width="78" height="150" rx="16" fill="#E8EDF2"/>
  <rect x="448" y="372" width="78" height="150" rx="16" fill="#E8EDF2"/>
  <rect x="540" y="372" width="78" height="150" rx="16" fill="#E8EDF2"/>
  <rect x="632" y="372" width="72" height="150" rx="16" fill="#E8EDF2"/>

  <!-- Finger separation grooves (void slots) split the knuckles -->
  <rect x="436" y="372" width="14" height="170" fill="#0D0F14"/>
  <rect x="528" y="372" width="14" height="170" fill="#0D0F14"/>
  <rect x="620" y="372" width="14" height="170" fill="#0D0F14"/>

  <!-- Thumb: a heavy block wrapping the lower-left, clamping over the palm edge -->
  <path fill="#E8EDF2"
        d="M316 512
           L316 646
           L266 690
           C 238 666 230 624 244 588
           C 256 558 284 532 316 512 Z"/>
  <!-- thumb knuckle crease -->
  <rect x="300" y="566" width="60" height="16" rx="8" fill="#0D0F14"/>
</svg>
