<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tileA" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a67"/>
      <stop offset="0.45" stop-color="#E63946"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glossA" cx="0.5" cy="0.12" r="0.85" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrowA" x1="280" y1="760" x2="760" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9d4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadowA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#7a0d18" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#tileA)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#glossA)"/>

  <!-- bold diagonal up-right climbing arrow, all one rotated group -->
  <g filter="url(#shadowA)" fill="url(#arrowA)" transform="rotate(-45 512 512)">
    <!-- shaft along the local x-axis -->
    <rect x="180" y="445" width="450" height="134" rx="60"/>
    <!-- arrowhead capping the shaft end -->
    <path d="M580 350 L820 512 L580 674 Z"/>
  </g>
</svg>
