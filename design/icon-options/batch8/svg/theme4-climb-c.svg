<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="tileC" cx="0.32" cy="0.22" r="1.05" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="0.5" stop-color="#E63946"/>
      <stop offset="1" stop-color="#b8350e"/>
    </radialGradient>
    <radialGradient id="glossC" cx="0.5" cy="0.1" r="0.85" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="medalC" x1="370" y1="330" x2="654" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.5" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="medalShineC" cx="0.4" cy="0.3" r="0.8" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonC" x1="0" y1="200" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd0d4"/>
    </linearGradient>
    <filter id="shadowC" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#5e1206" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#tileC)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#glossC)"/>

  <!-- ribbon tails behind the medal -->
  <g filter="url(#shadowC)" fill="url(#ribbonC)">
    <polygon points="430,300 520,300 478,470 396,452"/>
    <polygon points="594,300 504,300 546,470 628,452"/>
  </g>

  <!-- medallion disc -->
  <g filter="url(#shadowC)">
    <circle cx="512" cy="588" r="222" fill="url(#medalC)"/>
    <circle cx="512" cy="588" r="222" fill="url(#medalShineC)"/>
    <circle cx="512" cy="588" r="178" fill="none" stroke="#fffbe9" stroke-opacity="0.65" stroke-width="14"/>
    <!-- up-chevron climb mark inside -->
    <path fill="#c2410c"
      d="M512 472
         L636 614 L588 614 L512 528 L436 614 L388 614 Z"/>
    <path fill="#c2410c"
      d="M512 558
         L636 700 L588 700 L512 614 L436 700 L388 700 Z"/>
  </g>
</svg>
