<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="aBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#23344f"/>
      <stop offset="100%" stop-color="#1B2A41"/>
    </radialGradient>
    <linearGradient id="aShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2531"/>
      <stop offset="100%" stop-color="#7A1F2B"/>
    </linearGradient>
    <linearGradient id="aGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0C173"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9a7a33"/>
    </linearGradient>
    <linearGradient id="aKnot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EEDF"/>
      <stop offset="100%" stop-color="#D9CDB2"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#aBg)"/>

  <!-- laurel branches -->
  <g fill="#C9A24B" opacity="0.92">
    <g>
      <path d="M300 720 C220 640 200 540 235 440 C255 510 290 560 320 600 Z" opacity="0.0"/>
    </g>
  </g>
  <!-- left laurel -->
  <g fill="url(#aGold)">
    <path d="M286 742 C218 668 206 560 248 458 C262 530 296 586 332 632 C300 670 290 706 286 742 Z" opacity="0"/>
  </g>

  <!-- laurel leaves drawn as repeated shapes, left side -->
  <g fill="url(#aGold)">
    <!-- left stem -->
    <path d="M300 748 C238 678 224 580 262 478" fill="none" stroke="#C9A24B" stroke-width="10" stroke-linecap="round"/>
    <g>
      <ellipse cx="278" cy="500" rx="26" ry="13" transform="rotate(-58 278 500)"/>
      <ellipse cx="266" cy="548" rx="28" ry="14" transform="rotate(-50 266 548)"/>
      <ellipse cx="262" cy="598" rx="30" ry="15" transform="rotate(-40 262 598)"/>
      <ellipse cx="270" cy="648" rx="30" ry="15" transform="rotate(-28 270 648)"/>
      <ellipse cx="288" cy="696" rx="29" ry="14" transform="rotate(-16 288 696)"/>
    </g>
    <!-- right stem -->
    <path d="M724 748 C786 678 800 580 762 478" fill="none" stroke="#C9A24B" stroke-width="10" stroke-linecap="round"/>
    <g>
      <ellipse cx="746" cy="500" rx="26" ry="13" transform="rotate(58 746 500)"/>
      <ellipse cx="758" cy="548" rx="28" ry="14" transform="rotate(50 758 548)"/>
      <ellipse cx="762" cy="598" rx="30" ry="15" transform="rotate(40 762 598)"/>
      <ellipse cx="754" cy="648" rx="30" ry="15" transform="rotate(28 754 648)"/>
      <ellipse cx="736" cy="696" rx="29" ry="14" transform="rotate(16 736 696)"/>
    </g>
  </g>

  <!-- shield outer gold -->
  <path d="M512 168
           L792 248
           C792 470 730 660 512 790
           C294 660 232 470 232 248
           Z" fill="url(#aGold)"/>
  <!-- shield inner maroon -->
  <path d="M512 200
           L760 270
           C760 466 704 640 512 758
           C320 640 264 466 264 270
           Z" fill="url(#aShield)"/>
  <!-- inner thin gold pinstripe -->
  <path d="M512 222
           L740 286
           C740 458 690 624 512 734
           C334 624 284 458 284 286
           Z" fill="none" stroke="#C9A24B" stroke-width="6" opacity="0.85"/>

  <!-- ===== CENTRAL CHARGE: tied BJJ belt knot ===== -->
  <g transform="translate(512 458)">
    <!-- belt loop behind -->
    <path d="M-150 28 C-180 -10 -120 -52 -64 -38 L64 -38 C120 -52 180 -10 150 28
             C168 50 150 78 118 74 L-118 74 C-150 78 -168 50 -150 28 Z"
          fill="#5e1822"/>
    <!-- left band -->
    <rect x="-150" y="-24" width="120" height="70" rx="6" fill="url(#aKnot)"/>
    <!-- right band -->
    <rect x="30" y="-24" width="120" height="70" rx="6" fill="url(#aKnot)"/>
    <!-- black rank-bar zone on right band -->
    <rect x="56" y="-24" width="56" height="70" fill="#1B2A41"/>
    <!-- gold rank stripes on the bar -->
    <rect x="64" y="-20" width="8" height="62" fill="#C9A24B"/>
    <rect x="80" y="-20" width="8" height="62" fill="#C9A24B"/>
    <rect x="96" y="-20" width="8" height="62" fill="#C9A24B"/>

    <!-- knot center (the overlapping wrap) -->
    <rect x="-44" y="-46" width="88" height="112" rx="10" fill="url(#aKnot)"/>
    <rect x="-44" y="-46" width="88" height="112" rx="10" fill="none" stroke="#C9A24B" stroke-width="5"/>
    <!-- knot fold lines -->
    <path d="M-44 6 L44 6" stroke="#bcae8e" stroke-width="5" opacity="0.7"/>
    <!-- hanging tails -->
    <path d="M-30 66 L-50 168 L-12 168 L-2 66 Z" fill="url(#aKnot)"/>
    <path d="M30 66 L50 168 L12 168 L2 66 Z" fill="url(#aKnot)"/>
    <rect x="-50" y="150" width="38" height="18" fill="#1B2A41"/>
    <rect x="12" y="150" width="38" height="18" fill="#1B2A41"/>
  </g>

  <!-- top banner ribbon -->
  <g>
    <path d="M170 250 L300 230 L300 300 L170 320 Z" fill="#5e1822"/>
    <path d="M854 250 L724 230 L724 300 L854 320 Z" fill="#5e1822"/>
    <path d="M276 212 L748 212 L770 252 L748 292 L276 292 L254 252 Z" fill="url(#aShield)"/>
    <path d="M276 212 L748 212 L770 252 L748 292 L276 292 L254 252 Z" fill="none" stroke="#C9A24B" stroke-width="6"/>
    <!-- ELO RATED in serif -->
    <text x="512" y="270" font-family="serif" font-size="62" font-weight="bold" fill="#EDE6D6" text-anchor="middle" letter-spacing="6">ELO RATED</text>
  </g>

  <!-- EST 2026 bottom scroll -->
  <g>
    <path d="M362 808 L662 808 L686 842 L662 876 L362 876 L338 842 Z" fill="url(#aGold)"/>
    <path d="M362 808 L662 808 L686 842 L662 876 L362 876 L338 842 Z" fill="none" stroke="#9a7a33" stroke-width="4"/>
    <text x="512" y="858" font-family="serif" font-size="40" font-weight="bold" fill="#1B2A41" text-anchor="middle" letter-spacing="8">EST 2026</text>
  </g>
</svg>
