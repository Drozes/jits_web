<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="aShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A1F2B"/>
      <stop offset="1" stop-color="#5E141E"/>
    </linearGradient>
    <linearGradient id="aBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A41"/>
      <stop offset="1" stop-color="#121C2D"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2A3E5C"/>
      <stop offset="1" stop-color="#1B2A41" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#aBg)"/>
  <circle cx="512" cy="460" r="430" fill="url(#aGlow)"/>

  <!-- outer gold ring of the badge -->
  <circle cx="512" cy="470" r="388" fill="none" stroke="#C9A24B" stroke-width="14"/>
  <circle cx="512" cy="470" r="364" fill="none" stroke="#C9A24B" stroke-width="4"/>

  <!-- laurel branches -->
  <g fill="none" stroke="#C9A24B" stroke-width="11" stroke-linecap="round">
    <path d="M 250 690 Q 210 540 300 410"/>
    <path d="M 774 690 Q 814 540 724 410"/>
  </g>
  <g fill="#C9A24B">
    <!-- left laurel leaves -->
    <path d="M256 660 q-46 -8 -58 -46 q44 -2 58 46 z"/>
    <path d="M240 600 q-46 -2 -54 -42 q44 4 54 42 z"/>
    <path d="M230 538 q-44 4 -50 -34 q42 6 50 34 z"/>
    <path d="M228 476 q-42 10 -42 -28 q40 8 42 28 z"/>
    <path d="M236 418 q-38 16 -34 -22 q38 8 34 22 z"/>
    <!-- right laurel leaves -->
    <path d="M768 660 q46 -8 58 -46 q-44 -2 -58 46 z"/>
    <path d="M784 600 q46 -2 54 -42 q-44 4 -54 42 z"/>
    <path d="M794 538 q44 4 50 -34 q-42 6 -50 34 z"/>
    <path d="M796 476 q42 10 42 -28 q-40 8 -42 28 z"/>
    <path d="M788 418 q38 16 34 -22 q-38 8 -34 22 z"/>
  </g>

  <!-- shield -->
  <path d="M 512 168 L 720 232 L 720 472 Q 720 640 512 752 Q 304 640 304 472 L 304 232 Z"
        fill="url(#aShield)" stroke="#C9A24B" stroke-width="12"/>
  <path d="M 512 196 L 696 252 L 696 470 Q 696 622 512 722 Q 328 622 328 470 L 328 252 Z"
        fill="none" stroke="#EDE6D6" stroke-width="3" opacity="0.5"/>

  <!-- chief band -->
  <path d="M 328 252 L 696 252 L 696 320 L 328 320 Z" fill="#1B2A41"/>
  <line x1="328" y1="320" x2="696" y2="320" stroke="#C9A24B" stroke-width="5"/>

  <!-- ESTABLISHED stars in chief -->
  <g fill="#C9A24B">
    <polygon points="512,266 519,286 540,286 523,298 530,318 512,306 494,318 501,298 484,286 505,286"/>
    <circle cx="420" cy="286" r="6"/>
    <circle cx="604" cy="286" r="6"/>
  </g>

  <!-- CENTRAL CHARGE: ascending podium / climbing bars + arrow -->
  <g>
    <!-- three ascending bars -->
    <rect x="392" y="552" width="64" height="92" fill="#EDE6D6"/>
    <rect x="480" y="500" width="64" height="144" fill="#C9A24B"/>
    <rect x="568" y="436" width="64" height="208" fill="#E63946"/>
    <rect x="392" y="552" width="64" height="92" fill="none" stroke="#1B2A41" stroke-width="3"/>
    <rect x="480" y="500" width="64" height="144" fill="none" stroke="#1B2A41" stroke-width="3"/>
    <rect x="568" y="436" width="64" height="208" fill="none" stroke="#1B2A41" stroke-width="3"/>
    <!-- base line -->
    <rect x="372" y="644" width="280" height="14" fill="#C9A24B"/>
    <!-- climbing arrow over the bars -->
    <path d="M 412 560 L 500 504 L 588 444 L 646 404"
          fill="none" stroke="#EDE6D6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="664,392 612,398 642,440" fill="#EDE6D6"/>
  </g>

  <!-- banner ribbon -->
  <g>
    <path d="M 196 768 L 196 828 L 252 808 L 252 840 L 772 840 L 772 808 L 828 828 L 828 768
             L 760 800 L 760 770 L 264 770 L 264 800 Z" fill="#7A1F2B" stroke="#C9A24B" stroke-width="6"/>
    <rect x="288" y="788" width="448" height="30" fill="none"/>
    <text x="512" y="813" font-family="serif" font-size="46" font-weight="bold"
          fill="#EDE6D6" text-anchor="middle" letter-spacing="10">ELO RATED</text>
  </g>

  <!-- EST 2026 sub-banner -->
  <text x="512" y="893" font-family="serif" font-size="30" fill="#C9A24B"
        text-anchor="middle" letter-spacing="8">EST. 2026</text>
</svg>
