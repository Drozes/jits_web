<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- Concept A: a red hand clamping a white gi collar (lapel grip).
       The collar is a bold white V-band crossing the canvas;
       a heavy red fist+four-finger clamp grabs it. -->

  <!-- White gi collar: two parallel bands forming a V (the lapel) -->
  <polygon points="296,150 396,150 560,560 560,900 460,900 460,580" fill="#E8EDF2"/>
  <polygon points="728,150 628,150 464,560 464,900 564,900 564,580" fill="#E8EDF2"/>
  <!-- collar inner shadow stripe (darker plate) to separate the two lapels -->
  <polygon points="500,560 524,560 524,900 500,900" fill="#0D0F14"/>

  <!-- The GRIP: heavy red fist body clamping across the collar -->
  <!-- Back of hand / fist block -->
  <rect x="300" y="470" width="430" height="190" rx="24" fill="#E63946"/>

  <!-- Four fingers wrapping OVER the collar (top), as heavy bars -->
  <rect x="332" y="392" width="78" height="150" rx="20" fill="#E63946"/>
  <rect x="424" y="380" width="78" height="162" rx="20" fill="#E63946"/>
  <rect x="516" y="380" width="78" height="162" rx="20" fill="#E63946"/>
  <rect x="608" y="392" width="78" height="150" rx="20" fill="#E63946"/>

  <!-- Knuckle gaps cut as void slivers between fingers -->
  <rect x="412" y="392" width="14" height="120" fill="#0D0F14"/>
  <rect x="504" y="392" width="14" height="120" fill="#0D0F14"/>
  <rect x="596" y="392" width="14" height="120" fill="#0D0F14"/>

  <!-- Thumb clamping from the bottom-left, opposing the fingers -->
  <rect x="270" y="560" width="150" height="80" rx="36" fill="#E63946"/>
  <rect x="270" y="560" width="90" height="120" rx="36" fill="#E63946"/>

  <!-- Wrist anchoring to the right edge of the grip -->
  <rect x="690" y="500" width="80" height="140" rx="20" fill="#E63946"/>

  <!-- Gold tension spark: a single gold notch where the clamp bites hardest -->
  <polygon points="512,508 548,548 512,588 476,548" fill="#f59e0b"/>
</svg>
