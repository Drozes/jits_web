<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#0D0F14"/>

  <!-- ARMBAR: a captured white arm hyperextended over a solid red fulcrum -->

  <!-- Red fulcrum: one solid clamping block (attacker's hips pinning the arm) -->
  <rect x="296" y="556" width="432" height="168" fill="#E63946"/>

  <!-- The trapped arm, white, levered into a hard V over the fulcrum -->
  <!-- Upper-arm segment: from the shoulder lower-left up to the elbow apex -->
  <polygon points="248,792 344,732 540,464 444,404" fill="#E8EDF2"/>
  <!-- Forearm segment: from the elbow apex back down to the wrist on the fulcrum -->
  <polygon points="540,464 444,404 700,724 604,784" fill="#E8EDF2"/>

  <!-- Gold stress wedge AT the elbow apex = the break point -->
  <polygon points="444,404 540,464 492,360" fill="#f59e0b"/>

  <!-- Wrist clamp: heavy red band gripping the trapped wrist against the body -->
  <rect x="568" y="700" width="160" height="80" fill="#E63946"/>
</svg>
