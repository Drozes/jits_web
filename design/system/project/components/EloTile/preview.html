<!-- @dsCard group="Data" height=775 subtitle="ELO rating tile" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EloTile preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.k{padding:16px;display:flex;flex-direction:column;gap:18px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font-family:var(--font-mono);font-weight:400;font-size:10px;line-height:14px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--hairline-strong);border-radius:var(--radius-tag);font-family:var(--font-mono);font-weight:700;font-size:9px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink)}
.flag.today{color:var(--ink-2);border-color:var(--hairline)}
.note{font-family:var(--font-body);font-size:12px;line-height:17px;color:var(--ink-2);margin:0;max-width:358px}
.tab{font-variant-numeric:tabular-nums}
.ico{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile{background:var(--plate);border:1px solid var(--hairline);border-radius:var(--radius-plate);padding:14px 17.5px;min-width:120px;display:inline-flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.tile.c{padding:14px 10.5px;flex:1;min-width:0}
.lb{font-family:var(--font-mono);font-weight:700;font-size:10px;line-height:13px;letter-spacing:2.52px;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--font-mono);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.lb + .num{margin-top:8px}
.meta{font-family:var(--font-mono);font-weight:700;font-size:14px;line-height:18px;letter-spacing:1.12px;text-transform:uppercase;color:var(--ink-2);margin:4px 0;font-variant-numeric:tabular-nums}
.bar3{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--signal-red)}
.ba{display:flex;align-items:center;gap:10.5px;width:358px;max-width:100%}
.arrow{font-family:var(--font-mono);font-size:28px;color:var(--ink-3)}
.pos{border-color:var(--gain-green)}
.neg{border-color:var(--negative)}
.amb{border-color:var(--attention)}
.accent{border-color:var(--signal-red)}
</style>
</head>
<body>
<div class="k">
  <div class="cell"><p class="cap">size="hero" (96), accentBar, meta: Home</p>
    <div><div class="tile"><span class="num" style="font-size:96px;line-height:105.6px;letter-spacing:-3.84px">1526</span><span class="meta">14W &middot; 6L &middot; 1D</span><span class="bar3"></span></div></div>
  </div>
  <div class="row">
    <div class="cell"><p class="cap">large (64)</p><div class="tile"><span class="lb">ELO</span><span class="num" style="font-size:64px;line-height:70.4px;letter-spacing:-2.56px">1526</span></div></div>
    <div class="cell"><p class="cap">medium (44): weight</p><div class="tile"><span class="lb">lbs</span><span class="num" style="font-size:44px;line-height:48.4px;letter-spacing:-1.76px">170</span></div></div>
  </div>
  <div class="row">
    <div class="cell"><p class="cap">small (36), accent</p><div class="tile accent"><span class="lb">ELO</span><span class="num" style="font-size:36px;line-height:39.6px;letter-spacing:-1.44px">1526</span></div></div>
  </div>
  <div class="cell"><p class="cap">before / after, tone positive | negative | amber (landed)</p>
    <div class="ba"><div class="tile c"><span class="num" style="font-size:36px;line-height:39.6px;letter-spacing:-1.44px">1512</span></div><span class="arrow">&rarr;</span><div class="tile c pos"><span class="num" style="font-size:36px;line-height:39.6px;letter-spacing:-1.44px">1526</span></div></div>
    <div class="ba"><div class="tile c"><span class="num" style="font-size:36px;line-height:39.6px;letter-spacing:-1.44px">1526</span></div><span class="arrow">&rarr;</span><div class="tile c neg"><span class="num" style="font-size:36px;line-height:39.6px;letter-spacing:-1.44px">1517</span></div></div>
    <div class="ba"><div class="tile c"><span class="num" style="font-size:36px;line-height:39.6px;letter-spacing:-1.44px">1517</span></div><span class="arrow">&rarr;</span><div class="tile c amb"><span class="num" style="font-size:36px;line-height:39.6px;letter-spacing:-1.44px">1519</span></div></div>
  </div>
</div>
</body>
</html>
