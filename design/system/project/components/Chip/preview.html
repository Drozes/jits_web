<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.k{padding:16px;display:flex;flex-direction:column;gap:18px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font-family:var(--font-mono);font-weight:400;font-size:10px;line-height:14px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--hairline-strong);border-radius:var(--radius-tag);font-family:var(--font-mono);font-weight:700;font-size:9px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink)}
.flag.today{color:var(--ink-2);border-color:var(--hairline)}
.note{font-family:var(--font-body);font-size:12px;line-height:17px;color:var(--ink-2);margin:0;max-width:358px}
.tab{font-variant-numeric:tabular-nums}
.ico{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;align-self:flex-start;padding:7px 10.5px;border:1px solid var(--hairline-strong);border-radius:var(--radius-tag);background:var(--plate);font-family:var(--font-heading);font-weight:700;font-size:10px;line-height:13px;letter-spacing:1.12px;text-transform:uppercase;color:var(--ink-2)}
.chip.sel{background:var(--plate-bright);color:var(--ink)}
.chip.on{border-color:var(--signal-red);color:var(--ink)}
.chip.on::before{content:"";width:6px;height:6px;background:var(--signal-red);margin-right:7px;flex:none}
.chip.pressed{opacity:var(--opacity-pressed)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.bar{padding:10.5px 14px;border-bottom:1px solid var(--hairline-faint);display:flex;flex-direction:column;gap:8px;width:358px;max-width:100%}
</style>
</head>
<body>
<div class="k">
  <div class="sec"><span class="flag">Target (WP2)</span><p class="cap">selected = surface tier + hairline, no red</p></div>
  <div class="bar">
    <div class="chips"><span class="chip sel">Fighters</span><span class="chip">Gyms</span></div>
    <div class="chips"><span class="chip sel">All</span><span class="chip">Male</span><span class="chip">Female</span></div>
  </div>
  <div class="row">
    <div class="cell"><p class="cap">inactive</p><span class="chip">Gyms</span></div>
    <div class="cell"><p class="cap">selected</p><span class="chip sel">Fighters</span></div>
    <div class="cell"><p class="cap">pressed</p><span class="chip pressed">Male</span></div>
  </div>
  <div class="sec"><span class="flag today">Today</span><p class="cap">chip.tsx: red border + red square (ST-2)</p></div>
  <div class="bar">
    <div class="chips"><span class="chip on">Fighters</span><span class="chip">Gyms</span></div>
    <div class="chips"><span class="chip on">All</span><span class="chip">Male</span><span class="chip">Female</span></div>
  </div>
</div>
</body>
</html>
