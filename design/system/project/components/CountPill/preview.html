<!-- @dsCard group="Status" height=162 subtitle="Red count badge and tab marks" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CountPill preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.k{padding:16px;display:flex;flex-direction:column;gap:18px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font-family:var(--font-mono);font-weight:400;font-size:10px;line-height:14px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--hairline-strong);border-radius:var(--radius-tag);font-family:var(--font-mono);font-weight:700;font-size:9px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink)}
.flag.today{color:var(--ink-2);border-color:var(--hairline)}
.note{font-family:var(--font-body);font-size:12px;line-height:17px;color:var(--ink-2);margin:0;max-width:358px}
.tab{font-variant-numeric:tabular-nums}
.ico{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp{position:absolute;min-width:14px;min-height:14px;padding:0 3.5px;display:flex;align-items:center;justify-content:center;background:var(--signal-red);border-radius:var(--radius-tag);font-family:var(--font-mono);font-weight:700;font-size:9px;line-height:12px;color:var(--on-signal);font-variant-numeric:tabular-nums}
.solo{position:relative;display:inline-flex}
.solo .cp{position:static}
.bar{background:var(--panel);border:1px solid var(--hairline);border-radius:var(--radius-plate);padding:14px;display:flex;gap:28px;align-items:center;width:358px;max-width:100%}
.ic{position:relative;width:18px;height:18px;color:var(--ink-3)}
.ic .cp{top:-5.25px;right:-8.75px}
.bell{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bell .cp{top:0;right:0}
.mark{position:absolute;top:-1.75px;right:-5.25px;width:7px;height:7px;border-radius:50%}
.mark.dot{background:var(--gain-green)}
.mark.ring{border:1.5px solid var(--ink-3)}
.cell .cap{white-space:nowrap}
</style>
</head>
<body>
<div class="k">
  <div class="cell"><p class="cap">CountPill, formatBadgeCount</p>
    <div class="row">
      <span class="solo"><span class="cp">1</span></span>
      <span class="solo"><span class="cp">3</span></span>
      <span class="solo"><span class="cp">12</span></span>
      <span class="solo"><span class="cp">99+</span></span>
    </div>
  </div>
  <div class="cell"><p class="cap">Placed: header bell, tab icon count, dot, ring</p>
    <div class="bar">
      <div class="cell"><span class="bell"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><span class="cp">2</span></span></div>
      <div class="cell"><span class="ic"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="cp">5</span></span></div>
      <div class="cell"><span class="ic"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="mark dot"></span></span></div>
      <div class="cell"><span class="ic"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978"/><path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978"/><path d="M18 9h1.5a1 1 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6 9H4.5a1 1 0 0 1 0-5H6"/></svg><span class="mark ring"></span></span></div>
    </div>
  </div>
</div>
</body>
</html>
