<!-- @dsCard group="Feedback" height=478 subtitle="Shimmer placeholders" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.k{padding:16px;display:flex;flex-direction:column;gap:18px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font-family:var(--font-mono);font-weight:400;font-size:10px;line-height:14px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--hairline-strong);border-radius:var(--radius-tag);font-family:var(--font-mono);font-weight:700;font-size:9px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink)}
.flag.today{color:var(--ink-2);border-color:var(--hairline)}
.note{font-family:var(--font-body);font-size:12px;line-height:17px;color:var(--ink-2);margin:0;max-width:358px}
.tab{font-variant-numeric:tabular-nums}
.ico{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b{position:relative;overflow:hidden;background:var(--plate-bright);border-radius:var(--radius-tag)}
.b.md{border-radius:var(--radius-plate)}
.band{position:absolute;top:0;bottom:0;left:30%;width:40%;background:var(--ink);opacity:0.08}
.txt{display:flex;flex-direction:column;gap:6px;width:240px}
.splate{background:var(--plate);border:1px solid var(--hairline);border-left-width:1px;border-radius:var(--radius-plate);padding:14px;display:flex;gap:10.5px;align-items:center;width:358px;max-width:100%}
.rr{background:var(--plate);border-left:3px solid transparent;padding:10.5px 14px;display:flex;align-items:center;gap:10.5px;width:358px;max-width:100%}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.static .band{display:none}
</style>
</head>
<body>
<div class="k">
  <div class="cell"><p class="cap">On void: SkeletonText (3 lines) and SkeletonAvatar 32</p>
    <div class="row" style="align-items:center"><span class="b md" style="display:block;width:32px;height:32px"><span class="band"></span></span><div class="txt"><span class="b " style="display:block;width:100%;height:12px"><span class="band"></span></span><span class="b " style="display:block;width:100%;height:12px"><span class="band"></span></span><span class="b " style="display:block;width:60%;height:12px"><span class="band"></span></span></div></div>
  </div>
  <div class="cell"><p class="cap">SkeletonPlate with avatar and lines (one sweep frame)</p>
    <div class="splate"><span class="b md" style="display:block;width:32px;height:32px"><span class="band"></span></span><div class="grow"><span class="b " style="display:block;width:55%;height:15px"><span class="band"></span></span><span class="b " style="display:block;width:35%;height:11px"><span class="band"></span></span></div></div>
  </div>
  <div class="cell"><p class="cap">SkeletonRankRow (one sweep frame)</p>
    <div class="rr"><span class="b " style="display:block;width:36px;height:16px"><span class="band"></span></span><div class="grow"><span class="b " style="display:block;width:55%;height:15px"><span class="band"></span></span><span class="b " style="display:block;width:35%;height:11px"><span class="band"></span></span></div><div class="end"><span class="b " style="display:block;width:64px;height:24px"><span class="band"></span></span><span class="b " style="display:block;width:40px;height:18px"><span class="band"></span></span></div></div>
  </div>
  <div class="cell static"><p class="cap">Same row under Reduce Motion (static bars)</p>
    <div class="rr"><span class="b " style="display:block;width:36px;height:16px"><span class="band"></span></span><div class="grow"><span class="b " style="display:block;width:55%;height:15px"><span class="band"></span></span><span class="b " style="display:block;width:35%;height:11px"><span class="band"></span></span></div><div class="end"><span class="b " style="display:block;width:64px;height:24px"><span class="band"></span></span><span class="b " style="display:block;width:40px;height:18px"><span class="band"></span></span></div></div>
    <p class="note">The bars are plate-bright, one tier above the plate-tier row, so they still read with no band.</p>
  </div>
</div>
</body>
</html>
