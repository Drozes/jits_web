<!-- @dsCard group="Match flow" height=422 subtitle="Verdict rating card and the tap" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatingMoment preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.k{padding:16px;display:flex;flex-direction:column;gap:18px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font-family:var(--font-mono);font-weight:400;font-size:10px;line-height:14px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--hairline-strong);border-radius:var(--radius-tag);font-family:var(--font-mono);font-weight:700;font-size:9px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink)}
.flag.today{color:var(--ink-2);border-color:var(--hairline)}
.note{font-family:var(--font-body);font-size:12px;line-height:17px;color:var(--ink-2);margin:0;max-width:358px}
.tab{font-variant-numeric:tabular-nums}
.ico{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:var(--plate);border:1px solid var(--hairline);border-radius:var(--radius-plate);width:358px;max-width:100%}
.l{display:flex;flex-direction:column;gap:6px}
.lab{font-family:var(--font-mono);font-weight:500;font-size:10px;line-height:13px;letter-spacing:2.52px;color:var(--ink-3)}
.rt{display:flex;align-items:center;font-family:var(--font-mono);font-weight:700;font-size:22px;line-height:26px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.marks{display:flex;gap:3px;margin-left:10px;align-items:center}
.marks span{width:3px;height:14px;border-radius:1px;background:var(--signal-red)}
.d{font-family:var(--font-mono);font-weight:700;font-size:26px;line-height:32px;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--gain-green)} .dn{color:var(--negative)} .am{color:var(--attention)}
</style>
</head>
<body>
<div class="k">
  <div class="cell"><p class="cap">Submission win: tap marks filled, landed</p>
    <div class="rb"><div class="l"><span class="lab">RATING</span><span class="rt">1512 &rarr; 1526<span class="marks"><span></span><span></span><span></span></span></span></div><span class="d up">&#9650; +14</span></div>
  </div>
  <div class="cell"><p class="cap">Points win (no tap)</p>
    <div class="rb"><div class="l"><span class="lab">RATING</span><span class="rt">1512 &rarr; 1526</span></div><span class="d up">&#9650; +14</span></div>
  </div>
  <div class="cell"><p class="cap">Submission loss: marks shown filled, still, silent</p>
    <div class="rb"><div class="l"><span class="lab">RATING</span><span class="rt">1526 &rarr; 1517<span class="marks"><span></span><span></span><span></span></span></span></div><span class="d dn">&#9660; &minus;9</span></div>
  </div>
  <div class="cell"><p class="cap">Draw (amber delta)</p>
    <div class="rb"><div class="l"><span class="lab">RATING</span><span class="rt">1517 &rarr; 1519</span></div><span class="d am">&#9650; +2</span></div>
  </div>
</div>
</body>
</html>
