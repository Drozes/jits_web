<!-- @dsCard group="Actions" height=172 subtitle="Compact outline action, 44pt hit" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OutlineAction preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.k{padding:16px;display:flex;flex-direction:column;gap:18px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font-family:var(--font-mono);font-weight:400;font-size:10px;line-height:14px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--hairline-strong);border-radius:var(--radius-tag);font-family:var(--font-mono);font-weight:700;font-size:9px;letter-spacing:1.68px;text-transform:uppercase;color:var(--ink)}
.flag.today{color:var(--ink-2);border-color:var(--hairline)}
.note{font-family:var(--font-body);font-size:12px;line-height:17px;color:var(--ink-2);margin:0;max-width:358px}
.tab{font-variant-numeric:tabular-nums}
.ico{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip{background:var(--panel);border:1px solid var(--hairline);border-radius:var(--radius-tag);padding:14px;display:flex;flex-direction:column;gap:14px;width:358px;max-width:100%}
.oa{height:28px;display:inline-flex;align-items:center;padding:0 10.5px;border:1px solid var(--hairline-strong);border-radius:var(--radius-tag);font-family:var(--font-heading);font-weight:700;font-size:11px;line-height:14px;letter-spacing:1.12px;text-transform:uppercase;color:var(--ink)}
.oa.pressed{background:var(--plate-bright);transform:scale(0.97)}
.oa.disabled{opacity:var(--opacity-disabled)}
.oa.dim{border-color:var(--hairline);color:var(--ink-3)}
.states{display:flex;gap:14px;flex-wrap:wrap}
.labels{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="k">
  <div class="strip">
    <div class="cell"><p class="cap">Real labels</p>
      <div class="labels"><span class="oa">Roll</span><span class="oa">Open</span><span class="oa">Cancel</span><span class="oa">Confirm</span></div>
    </div>
    <div class="states">
      <div class="cell"><p class="cap">default</p><span class="oa">Roll</span></div>
      <div class="cell"><p class="cap">pressed</p><span class="oa pressed">Roll</span></div>
      <div class="cell"><p class="cap">disabled</p><span class="oa disabled">Cancel</span></div>
      <div class="cell"><p class="cap">dim (offline)</p><span class="oa dim">Roll</span></div>
    </div>
  </div>
</div>
</body>
</html>
